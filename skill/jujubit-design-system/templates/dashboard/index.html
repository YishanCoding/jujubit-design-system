<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JuJuBit · 示例数据看板模板</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../../../tokens.css" />
    <link rel="stylesheet" href="../../../../components.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"
      defer
    ></script>
    <script src="html2canvas.min.js" defer></script>
    <script src="dashboard-kit.js" defer></script>
    <style>
      body {
        margin: 0;
        background: var(--jjb-dash-bg);
      }
      .jjb-dash {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="jjb-dash">
      <header class="jjb-dash-topbar">
        <span class="jjb-dash-topbar__icon">J</span
        ><strong class="jjb-dash-topbar__product">JuJuBit</strong
        ><span class="jjb-dash-topbar__sep">/</span
        ><span class="jjb-dash-topbar__title">示例数据看板</span
        ><span class="jjb-dash-topbar__spacer"></span
        ><span class="jjb-dash-badge">示例数据</span
        ><span class="jjb-dash-badge jjb-dash-badge--green" data-range></span>
      </header>
      <main class="jjb-dash-main">
        <div class="jjb-dash-date-bar" id="date-bar"></div>
        <div class="jjb-dash-section-label">核心指标 · 示例数据</div>
        <div class="jjb-dash-kpis" id="kpis"></div>
        <div class="jjb-dash-section-label">趋势 · 示例数据</div>
        <article class="jjb-dash-card" id="trend-card">
          <div class="jjb-dash-chart-head">
            <div>
              <h1 class="jjb-dash-chart-head__title">
                渠道下载趋势
                <button
                  class="jjb-dash-help"
                  type="button"
                  data-info="示例数据。<br>分子是下载；无效值断线不补零。"
                >
                  ?
                </button>
              </h1>
              <p class="jjb-dash-chart-head__sub">
                悬停绘图区查看当天；点击固定日期。
              </p>
            </div>
            <div class="jjb-dash-chart-head__actions">
              <div class="jjb-dash-view-toggle" data-view-toggle></div>
              <button class="jjb-dash-copy" type="button" id="copy" data-no-copy>
                复制图片</button
              ><span
                class="jjb-dash-badge jjb-dash-badge--green"
                data-range
              ></span>
            </div>
          </div>
          <div class="jjb-dash-chips" id="chips" aria-label="渠道筛选"></div>
          <div class="jjb-dash-chart-scroll" data-chart-view id="plot"></div>
          <div data-numbers hidden id="numbers"></div>
          <div class="jjb-dash-legend" id="legend"></div>
          <div class="jjb-dash-callout">
            口径：固定种子生成的示例数据；缺失值断线，虚线表示不同口径。
          </div>
        </article>
      </main>
    </div>
    <script>
      window.addEventListener("load", () => {
        const K = JJBDash,
          data = K.sampleData(4319),
          dates = data.map((r) => r.date),
          state = K.createState({ preset: "近 90 天" }),
          items = [
            { id: "search", name: "自然搜索", color: "c-search" },
            { id: "asa", name: "ASA", color: "c-asa" },
            { id: "browse", name: "Browse", color: "c-browse" },
            {
              id: "web",
              name: "Web Referrer",
              color: "c-web",
              detail: true,
              dashed: true,
            },
          ];
        K.dateBar(document.querySelector("#date-bar"), state, dates, [
          ...document.querySelectorAll("[data-range]"),
        ]);
        K.chips(
          document.querySelector("#chips"),
          state,
          "channels",
          items,
          (id) =>
            K.inRange(data, K.range(state.value, dates)).some(
              (r) => r[id] != null,
            ),
          { selected: ["search", "asa"] },
        );
        K.viewToggle(document.querySelector("#trend-card"), state, "trend");
        K.infoTip(document);
        document
          .querySelector("#copy")
          .addEventListener("click", (e) =>
            K.copyImage(e.currentTarget, document.querySelector("#trend-card")),
          );
        function update() {
          const rows = K.inRange(data, K.range(state.value, dates)),
            picked = items.filter((x) =>
              state.value.chips.channels.includes(x.id),
            ),
            weekly = K.aggregate(
              rows,
              state.value.granularity,
              items.map((x) => x.id),
            ),
            count = rows.reduce(
              (n, r) => n + picked.reduce((a, s) => a + r[s.id], 0),
              0,
            );
          document.querySelector("#kpis").innerHTML =
            `<div class="jjb-dash-kpi"><i class="jjb-dash-kpi__dot"></i><div class="jjb-dash-kpi__value">${K.fmt(count)}</div><div class="jjb-dash-kpi__label">选中渠道下载 · 示例数据</div></div><div class="jjb-dash-kpi"><i class="jjb-dash-kpi__dot"></i><div class="jjb-dash-kpi__value">${K.fmt(rows.length)}</div><div class="jjb-dash-kpi__label">有数据天数 · 示例数据</div></div>`;
          K.lineChart(
            document.querySelector("#plot"),
            weekly,
            picked.map((s) => ({ ...s, key: s.id })),
          );
          K.legend(document.querySelector("#legend"), picked);
          K.table(
            document.querySelector("#numbers"),
            [
              {
                label: state.value.granularity === "week" ? "周" : "日期",
                value: (r) => r.label,
              },
              ...picked.map((s) => ({
                label: s.name,
                value: (r) => K.fmt(r[s.id]),
              })),
            ],
            weekly,
          );
        }
        state.subscribe(update);
        let t;
        window.addEventListener("resize", () => {
          clearTimeout(t);
          t = setTimeout(update, 120);
        });
      });
    </script>
  </body>
</html>
